<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.14  0 0 0 0.55 -0.05"/>
  </filter>
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.35 -0.08"/>
  </filter>
  <rect width="260" height="260" filter="url(#grain)"/>
  <rect width="260" height="260" filter="url(#fibres)"/>
</svg>
